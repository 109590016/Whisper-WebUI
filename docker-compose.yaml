services:
  whisper-webui:
    container_name: recordtrans
    build: .
    image: recordtrans:local

    volumes:
      - ${RECORDTRANS_DATA_DIR:-./data}:/data
      - recordtrans-models:/Whisper-WebUI/models
      - ./configs:/Whisper-WebUI/configs

    ports:
      - "127.0.0.1:${RECORDTRANS_PORT:-7860}:7860"

    environment:
      DATA_DIR: /data
      TZ: Asia/Taipei
      RECORDTRANS_MODEL_DIR: /Whisper-WebUI/models
      RECORDTRANS_MODEL: ${RECORDTRANS_MODEL:-small}
      RECORDTRANS_DEVICE: ${RECORDTRANS_DEVICE:-cuda}
      RECORDTRANS_COMPUTE_TYPE: ${RECORDTRANS_COMPUTE_TYPE:-float16}

    stdin_open: true
    tty: true

    entrypoint: ["python", "app.py", "--server_port", "7860", "--server_name", "0.0.0.0", "--output_dir", "/data/outputs"]

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:7860/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

    shm_size: "2gb"
    restart: unless-stopped

    # If you're not using nvidia GPU, Update device to match yours.
    # See more info at : https://docs.docker.com/compose/compose-file/deploy/#driver
    # You can remove the entire `deploy' section if you are using CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

volumes:
  recordtrans-models:
    name: recordtrans-models
